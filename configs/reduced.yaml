# Reduced configuration actually used to produce the results shipped in paper/ and results/.
# Same protocol as default.yaml (10-fold nested CV, all baselines, all classifiers), but fewer
# repetitions and a smaller swarm so it finishes in about an hour on a 2-core machine.
# For the final paper, re-run with configs/default.yaml.

experiment:
  name: reduced
  results_dir: results
  datasets: [breast_cancer, pima_diabetes, heart_cleveland]
  n_seeds: 5
  seed_offset: 0
  outer_folds: 10
  n_jobs: -1

fitness:
  alpha: 0.99
  estimator: logreg
  inner_folds: 5
  metric: accuracy

bpso:
  n_particles: 20
  n_iterations: 50
  inertia: linear
  w: 0.7298
  w_max: 0.9
  w_min: 0.4
  c1: 2.0
  c2: 2.0
  v_max: 6.0
  transfer_function: sigmoid
  init_prob: 0.5
  empty_subset: repair
  early_stopping_patience: null
  n_jobs: 1

ga:
  crossover_rate: 0.9
  mutation_rate: null
  tournament_size: 3
  n_elite: 1

methods: [all, bpso, ga, mi_k, mi_cv, anova_k, anova_cv, rfe_k, l1, random_k]

classifiers: [logreg, svm, rf, knn, nb, xgb]
use_xgboost: true
tune_classifiers: false

alpha_sweep:
  enabled: true
  alphas: [0.80, 0.90, 0.95, 0.99]
  n_seeds: 2
  classifiers: [logreg, svm, rf, knn, nb, xgb]

reporting:
  reference_method: bpso
  primary_metric: f1
  report_classifier: auto
  tuning_scoring: roc_auc
  figures_dir: paper/figures
  tables_dir: paper/tables
