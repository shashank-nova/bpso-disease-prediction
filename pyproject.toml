[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bpso-fs"
version = "1.0.0"
description = "Binary Particle Swarm Optimization feature selection for disease prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "joblib>=1.2",
    "tqdm>=4.64",
]

[project.optional-dependencies]
xgb = ["xgboost>=1.7"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "streamlit>=1.47", "requests>=2.31"]
dev = ["pytest>=7", "black>=23", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
